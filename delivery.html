<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PartDash Delivery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #111827;
}

/* =========================
   LOGIN
========================= */

.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #111827, #1f2937);
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: white;
    border-radius: 22px;
    padding: 30px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 8px;
}

.logo span {
    color: #2563eb;
}

.login-subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 28px;
}

.input-group {
    margin-bottom: 16px;
}

.input-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 7px;
}

.input-group input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
}

.input-group input:focus {
    border-color: #2563eb;
}

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.login-btn:hover {
    background: #1d4ed8;
}

.demo-text {
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
    margin-top: 15px;
}

/* =========================
   APP
========================= */

.app {
    display: none;
    min-height: 100vh;
}

/* HEADER */

.header {
    background: #111827;
    color: white;
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.header-inner {
    max-width: 900px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-logo {
    font-size: 23px;
    font-weight: 800;
}

.header-logo span {
    color: #60a5fa;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.driver-name {
    font-size: 14px;
    color: #d1d5db;
}

.logout-btn {
    background: #374151;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
}

/* MAIN */

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

/* STATUS */

.status-bar {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.status-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.status-dot {
    width: 11px;
    height: 11px;
    background: #22c55e;
    border-radius: 50%;
}

.status-text {
    font-weight: 700;
}

.orders-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 14px;
}

/* ORDER CARD */

.order-card {
    background: white;
    border-radius: 18px;
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

.order-top {
    padding: 16px;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #eee;
}

.order-id {
    font-weight: 800;
}

.order-price {
    font-weight: 800;
    color: #16a34a;
}

.order-body {
    padding: 16px;
}

.location {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
}

.location-icon {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eff6ff;
    flex-shrink: 0;
}

.location-info {
    flex: 1;
}

.location-label {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 3px;
}

.location-address {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
}

.order-items {
    margin-bottom: 18px;
}
